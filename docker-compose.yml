# The production image, run locally against an API, to try a build as it will be deployed:
#   docker compose up --build     then open http://localhost:8080
# Not used by CI or deployment. API_UPSTREAM comes from .env (see .env.example).
name: id-indetails-client

services:
  web:
    build: .
    image: id-indetails-client:local
    container_name: id-indetails-client
    ports:
      - "8080:8080"
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-https://host.docker.internal:7187}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      # nginx writes its pid and temp files, and the filled-in config, here: everything else is read-only
      - /tmp:uid=101,gid=101
      - /etc/nginx/conf.d:uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
